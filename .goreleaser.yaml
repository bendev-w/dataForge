version: 2

project_name: dataforge

before:
  hooks:
    - go mod tidy

builds:
  - id: dataforge
    main: .
    binary: dataforge
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/dataforge/cmd.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "dataforge_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
